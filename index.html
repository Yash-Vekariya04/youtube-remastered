<!doctype html>
<!-- ============================================================
  ViewTube — YouTube clone, built FROM SCRATCH, step by step.
  ------------------------------------------------------------
  BUILD ROADMAP (one step at a time):
    [x] STEP 1 · Layout skeleton — header, sidebar, chips, static grid
    [ ] STEP 2 · Data-driven grid — move videos into a JS array + render
    [ ] STEP 3 · Watch page — video player + actions + related list
    [ ] STEP 4 · Search & filters — working search box + chips
    [ ] STEP 5 · Shorts shelf + overlay player
    [ ] STEP 6 · Polish — themes, design panel, saved state
  HOW TO EDIT THE DESIGN:
    → Every color / size / radius lives in the DESIGN TOKENS
      block at the top of the <style> tag. Change one variable
      and the whole page re-skins itself.
============================================================ -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | BetterTube</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 90 64'%3E%3Crect width='90' height='64' rx='14' fill='%23ff0033'/%3E%3Cpath d='M36 18 L62 32 L36 46 Z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ================= HEADER ================= -->
    <header>
      <div class="h-left">
        <button class="icon-btn" id="menuBtn" aria-label="Menu">
          <i data-lucide="menu"></i>
        </button>
        <a class="logo" href="#" aria-label="ViewTube home">
          <svg viewBox="0 0 90 64" aria-hidden="true">
            <rect width="90" height="64" rx="16" style="fill: var(--accent)" />
            <path d="M35 17 L64 32 L35 47 Z" fill="#fff" />
          </svg>
          <b>Better<em>Tube</em></b>
        </a>
      </div>
      <div class="h-center">
        <form class="search" onsubmit="return false;">
          <div class="box">
            <input id="searchInput" type="text" placeholder="Search" aria-label="Search" />
          </div>
          <button class="go" aria-label="Search">
            <i data-lucide="search"></i>
          </button>
        </form>
        <button class="mic" aria-label="Voice search">
          <i data-lucide="mic"></i>
        </button>
      </div>
      <div class="h-right">
        <button class="icon-btn" aria-label="Create">
          <i data-lucide="plus"></i>
        </button>
        <button class="icon-btn" aria-label="Notifications">
          <i data-lucide="bell"></i>
        </button>
        <button
          class="avatar me"
          style="background: #3949ab"
          aria-label="Your channel"
        >
          AC
        </button>
      </div>
    </header>

    <!--  SIDEBAR (full)  -->
    <aside id="sidebar">
      <button class="sb-item active"><i data-lucide="house"></i>Home</button>
      <button class="sb-item"><i data-lucide="zap"></i>Shorts</button>
      <button class="sb-item"><i data-lucide="users"></i>Subscriptions</button>
      <hr class="sb-hr" />
      <button class="sb-item"><i data-lucide="history"></i>History</button>
      <button class="sb-item"><i data-lucide="list-video"></i>Playlists</button>
      <button class="sb-item"><i data-lucide="bookmark"></i>Watch Later</button>
      <button class="sb-item">
        <i data-lucide="thumbs-up"></i>Liked videos
      </button>
      <hr class="sb-hr" />
      <div class="sb-sec">Explore</div>
      <button class="sb-item"><i data-lucide="trending-up"></i>Trending</button>
      <button class="sb-item"><i data-lucide="music"></i>Music</button>
      <button class="sb-item"><i data-lucide="gamepad-2"></i>Gaming</button>
      <hr class="sb-hr" />
      <button class="sb-item"><i data-lucide="settings"></i>Settings</button>
    </aside>

    <!-- SIDEBAR (mini)  -->
    <aside id="miniSide">
      <button class="mn-item active"><i data-lucide="house"></i>Home</button>
      <button class="mn-item"><i data-lucide="zap"></i>Shorts</button>
      <button class="mn-item"><i data-lucide="users"></i>Subs</button>
      <button class="mn-item"><i data-lucide="thumbs-up"></i>Liked</button>
    </aside>

    <!--  CONTENT  -->
    <div id="content">
      <nav id="chipsbar">
      </nav>
      <main>
        <section id="grid">
          <!-- Video cards will be rendered here by JavaScript dynamically -->
        </section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
